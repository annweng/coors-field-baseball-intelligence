name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cfbi
          POSTGRES_PASSWORD: cfbi_dev_password
          POSTGRES_DB: coors_field_bi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cfbi -d coors_field_bi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cfbi:cfbi_dev_password@localhost:5432/coors_field_bi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tests/requirements.txt

      - name: Apply database schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=cfbi_dev_password psql -h localhost -U cfbi -d coors_field_bi -f database/init/001_schema.sql
          PGPASSWORD=cfbi_dev_password psql -h localhost -U cfbi -d coors_field_bi -f database/migrations/002_game_scores.sql

      - name: Unit tests
        run: python -m pytest tests/ -q -m "not integration"

      - name: Integration tests
        run: python -m pytest tests/ -q -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
